[project]
name = "tech-challenge-f2"
version = "1.0.0"
description = "Pipeline hibrida (batch + streaming) para analise da alfabetizacao no Brasil"
requires-python = ">=3.10"
dependencies = [
    "basedosdados>=2.0",
    "google-cloud-storage>=2.14",
    "google-cloud-pubsub>=2.21",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pandas-gbq>=0.22",
    "google-cloud-bigquery>=3.17",
    "db-dtypes>=1.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32", "plotly>=5.20", "google-auth>=2.28"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "quality"]
